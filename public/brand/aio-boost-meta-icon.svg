<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AIO boost AB logo</title>
  <desc id="desc">Gold rounded square with the black letters AB.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe78a"/>
      <stop offset="0.48" stop-color="#e7b83f"/>
      <stop offset="1" stop-color="#b97812"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#fff9d6" stop-opacity="0.66"/>
      <stop offset="0.5" stop-color="#fff9d6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#09090d"/>
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#gold)" filter="url(#shadow)"/>
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#shine)"/>
  <rect x="108" y="108" width="808" height="808" rx="178" fill="none" stroke="#ffe9a0" stroke-opacity="0.62" stroke-width="8"/>
  <text x="512" y="615" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="330" font-weight="900" letter-spacing="-28" fill="#111014">AB</text>
</svg>
